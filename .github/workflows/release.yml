name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        required: true
        type: choice
        options: [PATCH, MINOR, MAJOR]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          INCREMENT: ${{ inputs.increment }}
        run: |
          set +e
          uvx --from commitizen cz bump --yes ${INCREMENT:+--increment "$INCREMENT"}
          status=$?
          set -e
          if [ "$status" -eq 21 ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          version="$(git describe --tags --exact-match HEAD)"
          uvx --from commitizen cz changelog "$version" --dry-run > release-notes.md
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        if: steps.bump.outputs.released == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64 musl-tools
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        if: steps.bump.outputs.released == 'true'

      - name: Build
        if: steps.bump.outputs.released == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-pc-windows-gnu
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/pcue "dist/pcue-$VERSION-linux-x86_64"
          cp target/x86_64-pc-windows-gnu/release/pcue.exe "dist/pcue-$VERSION-windows-x86_64.exe"
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Push version commit and tag
        if: steps.bump.outputs.released == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: git push --atomic origin HEAD:main "$VERSION"

      - name: GitHub release
        if: steps.bump.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "$VERSION" dist/* --title "$VERSION" --notes-file release-notes.md
