name: Tests

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Lint (Linux)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Lint (Windows)
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-gnu -- -D warnings

      - name: Test
        run: cargo test --locked
