[package]
name = "pcue"
version = "0.7.0"
edition = "2024"
description = "Rotinas para o desktop Linux: abre apps nos workspaces, grava e reproduz ações, dispara por evento ou horário"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
interprocess = "2"
jiff = "0.2"
ratatui = "0.29"
png = "0.18.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
libc = "0.2"
zbus = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true

# scripts/package.sh deb: empacota o binário musl já compilado.
[package.metadata.deb]
maintainer = "Parsec-Inc <noreply@github.com>"
section = "utils"
priority = "optional"
extended-description = "Abre apps nos workspaces, grava e reproduz ações de teclado e mouse e dispara rotinas por evento ou horário. Inclui a regra de udev que dá ao usuário da sessão acesso ao teclado, mouse e uinput."
maintainer-scripts = "packaging/linux/"
assets = [
    ["target/release/pcue", "usr/bin/", "755"],
    ["packaging/linux/70-pcue.rules", "usr/lib/udev/rules.d/70-pcue.rules", "644"],
    ["packaging/linux/modules-load.conf", "usr/lib/modules-load.d/pcue.conf", "644"],
    ["README.md", "usr/share/doc/pcue/README.md", "644"],
]
