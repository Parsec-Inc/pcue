[package]
name = "pcue"
version = "0.1.0"
edition = "2024"
description = "Rotinas para o desktop Linux: abre apps nos workspaces, grava e reproduz ações, dispara por evento ou horário"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
evdev = "0.12"
jiff = "0.2"
ratatui = "0.29"
png = "0.18.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
zbus = "5"

[profile.release]
strip = true
lto = true
