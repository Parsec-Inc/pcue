[package]
name = "pcue"
version = "0.1.0"
edition = "2024"
description = "Abre apps no login do Hyprland, cada um no seu workspace"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
evdev = "0.12"
jiff = "0.2"
ratatui = "0.29"
png = "0.18.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
zbus = "5"

[profile.release]
strip = true
lto = true
